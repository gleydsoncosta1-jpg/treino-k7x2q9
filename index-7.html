<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Treino da Semana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Layout: app de uma coluna com barra de abas fixa embaixo (Hoje, Treinos, Histórico, Ajustes). Cada treino tem uma cor própria. */
  :root {
    --bg: #EEF0F5;
    --surface: #FFFFFF;
    --ink: #141A2E;
    --muted: #5B647C;
    --line: #D9DEEA;
    --accent: #2B4BEE;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4E9FE;
    --ok: #12805C;
    --on-ok: #FFFFFF;
    --warn: #B3261E;
    --d1: #2B4BEE;
    --d2: #0B8580;
    --d3: #BE3475;
    --d4: #B3680A;
    --on-d: #FFFFFF;
    --bar-bg: #141A2E;
    --bar-fg: #F2F4FB;
    --bar-accent: #93A5FF;
    --bar-accent-ink: #0B1030;
    --display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
    --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1320; --surface: #181D2E; --ink: #EDF0F8; --muted: #9AA3BC; --line: #2A3148;
      --accent: #8196FF; --accent-ink: #0B1030; --accent-soft: #212A55; --ok: #4FD0A1; --on-ok: #06261D; --warn: #FF8A80;
      --d1: #8196FF; --d2: #3CC7C0; --d3: #F27DB0; --d4: #F2B04C; --on-d: #0F1320; --bar-bg: #2A3148;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1320; --surface: #181D2E; --ink: #EDF0F8; --muted: #9AA3BC; --line: #2A3148;
    --accent: #8196FF; --accent-ink: #0B1030; --accent-soft: #212A55; --ok: #4FD0A1; --on-ok: #06261D; --warn: #FF8A80;
    --d1: #8196FF; --d2: #3CC7C0; --d3: #F27DB0; --d4: #F2B04C; --on-d: #0F1320; --bar-bg: #2A3148;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    background: var(--bg); color: var(--ink);
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button, input, select, textarea, summary { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }

  .app { max-width: 560px; margin-inline: auto; padding-top: 8px; padding-bottom: 170px; }

  .nav { display: flex; align-items: center; min-height: 52px; }
  .back { display: inline-flex; align-items: center; gap: 4px; height: 44px; margin-left: -8px; padding: 0 12px 0 6px; border: 0; background: transparent; color: var(--accent); font-weight: 700; }
  .back svg { width: 20px; height: 20px; }

  h1, h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; text-wrap: balance; margin: 0; }
  h1 { font-size: 38px; }
  h2 { font-size: 28px; }
  h3 { font-size: 18px; line-height: 1.25; margin: 0; }
  h4 { font-size: 13px; margin: 26px 0 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .meta { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .msg { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; font-weight: 600; }

  /* Botões e campos */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--warn); }
  .btn.danger.armed { background: var(--warn); border-color: var(--warn); color: var(--bg); }
  .btn.block { display: flex; width: 100%; }
  .btn.small { min-height: 44px; font-size: 15px; padding: 0 14px; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .inp { width: 100%; min-width: 0; height: 52px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 16px; }
  textarea.inp { height: 140px; padding: 12px 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; resize: vertical; }
  select.inp { appearance: auto; }
  .lbl { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gap { display: grid; gap: 10px; }

  /* Faixa da semana */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 16px; }
  .wd { display: grid; justify-items: center; gap: 4px; padding: 8px 0; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
  .wd span { font-size: 12px; font-weight: 700; }
  .wd i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
  .wd i svg { width: 14px; height: 14px; }
  .wd.did i { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .wd.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .wd small { max-width: 100%; padding: 0 2px; font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Cartões de treino */
  .tcard { margin-top: 18px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
  .tcard h2 { margin: 6px 0 10px; }
  .tcard .btn { margin-top: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; }
  .tag::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--dc, var(--accent)); }
  .list { display: grid; gap: 10px; margin-top: 12px; }
  .rcard { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 12px 12px 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
  .rcard::before { content: ''; align-self: stretch; background: var(--dc); }
  .rcard b { display: block; font-size: 16px; line-height: 1.25; }
  .rcard small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .acts { display: flex; gap: 8px; }

  /* Linhas de exercício */
  .thumb { display: block; width: 64px; border-radius: 10px; background: var(--bg); overflow: hidden; flex: none; }
  .panel img { display: block; width: 100%; height: auto; max-height: 340px; object-fit: contain; border-radius: 10px; }
  .thumb img, .lrow .ph img { display: block; width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .thumb svg, .panel svg { display: block; width: 100%; height: auto; }
  .xrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) 64px; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 10px 14px; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .xrow.noimg { grid-template-columns: 36px minmax(0, 1fr); }
  .xrow .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 15px; }
  .xrow .n svg { display: none; width: 18px; height: 18px; }
  .xrow.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .xrow.done .n span { display: none; }
  .xrow.done .n svg { display: block; }
  .xrow.done .thumb { opacity: .55; }
  .xrow b { display: block; font-size: 16px; line-height: 1.25; }
  .xrow small { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); }
  .lrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 8px 12px 8px 8px; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .lrow .ph { width: 64px; height: 48px; overflow: hidden; border-radius: 10px; background: var(--bg); }
  .lrow b { display: block; font-size: 16px; line-height: 1.25; }
  .lrow small { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); }
  .lrow .plus { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 20px; color: var(--accent); }
  .lrow.on .plus { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .ghead { margin: 18px 0 8px; font-family: var(--display); font-weight: 800; font-size: 18px; }
  .ghead small { margin-left: 6px; font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .gchip { min-height: 40px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 700; }
  .gchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  /* Tela do dia / treino em andamento */
  .dayhead { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; margin-top: 4px; }
  .badge { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--dc); color: var(--on-d); font-family: var(--display); font-weight: 800; font-size: 30px; }
  .badge svg { width: 30px; height: 30px; }
  .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--dc, var(--accent)); transition: width .25s ease; }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .prog .track { flex: 1; }
  .prog span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .banner { margin-top: 18px; padding: 16px; border-radius: 16px; background: var(--ok); color: var(--on-ok); font-weight: 700; }
  .xlist { display: grid; gap: 8px; margin-top: 18px; }
  .datebox { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .datebox .inp { width: auto; flex: 1; }

  /* Tela do exercício */
  .dots { display: flex; gap: 4px; margin-top: 12px; }
  .dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .dots i.on { background: var(--ok); }
  .dots i.cur { background: var(--dc); }
  .exname { margin-top: 18px; }
  .target { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; }
  .target b { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -.02em; color: var(--dc); font-variant-numeric: tabular-nums; }
  .target span { font-size: 16px; color: var(--muted); }
  .demo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .demo.n1 { grid-template-columns: minmax(0, 280px); justify-content: center; }
  .panel { margin: 0; padding: 6px 6px 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .panel figcaption { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .demo-note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .tip { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); }
  .tip p { margin: 4px 0 0; max-width: 65ch; }
  .vid { margin-top: 14px; }
  .sets { display: grid; gap: 10px; margin-top: 22px; }
  .sethead, .set { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
  .sethead.bw, .set.bw { grid-template-columns: 34px minmax(0, 1fr) 56px; }
  .sethead span { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .sethead span:first-child { text-align: left; }
  .set .no { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); }
  .set input { width: 100%; min-width: 0; height: 56px; padding: 0 8px; text-align: center; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .set input::placeholder { color: var(--muted); opacity: .55; }
  .set.done input { border-color: var(--ok); }
  .tick { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
  .tick svg { width: 26px; height: 26px; }
  .set.done .tick { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .big { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 72px; margin-top: 22px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--surface); font-weight: 700; font-size: 18px; }
  .big svg { width: 28px; height: 28px; }
  .big.on { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .rounds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 22px; }
  .rd { height: 56px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .rd[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .exnav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 26px; }

  /* Editor de treino */
  .hues { display: flex; gap: 10px; margin-top: 6px; }
  .hue { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; background: var(--hc); box-shadow: 0 0 0 1px var(--line); }
  .hue[aria-pressed="true"] { border-color: var(--bg); box-shadow: 0 0 0 3px var(--ink); }
  .eitem { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .eitem .top { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
  .eitem b { display: block; font-size: 16px; line-height: 1.25; }
  .eitem small { display: block; font-size: 13px; color: var(--muted); }
  .eitem .ctrl { display: grid; grid-template-columns: 1fr 1fr auto auto auto; gap: 8px; align-items: end; margin-top: 10px; }
  .eitem .ctrl.one { grid-template-columns: 1fr auto auto auto; }
  .eitem .ctrl label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .eitem .ctrl .inp { height: 44px; margin-top: 2px; text-align: center; }
  .ib { width: 44px; height: 44px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 800; font-size: 18px; }
  .ib[disabled] { opacity: .35; }
  .sticky-done { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); margin-top: 18px; z-index: 5; }

  /* Calendário e histórico */
  .cal { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .calh { display: flex; align-items: center; justify-content: space-between; }
  .calh b { font-family: var(--display); font-size: 18px; text-transform: capitalize; }
  .calg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; }
  .calg .h { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .cd { position: relative; height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; font-variant-numeric: tabular-nums; }
  .cd.x { visibility: hidden; }
  .cd.has::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ok); }
  .cd.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cd.sel { background: var(--ink); color: var(--bg); }
  .scard { display: block; width: 100%; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .scard .eyebrow { display: block; }
  .scard b { display: block; margin-top: 2px; font-size: 17px; }
  .scard small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .hx { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hx b { display: block; }
  .hx small { display: block; color: var(--muted); font-size: 14px; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; min-height: 40px; padding: 0 14px; font-size: 14px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .spark { width: 100%; height: 60px; margin-top: 8px; }
  .wk { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 8px; }
  .wk b { font-size: 15px; }
  details { margin-top: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  summary { display: flex; align-items: center; min-height: 52px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  details[open] summary { border-bottom: 1px solid var(--line); }
  .tip-item { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .tip-item:last-child { border-bottom: 0; }
  .tip-item b { display: block; margin-bottom: 2px; font-size: 14px; }
  .tip-item p { margin: 0; color: var(--muted); font-size: 15px; max-width: 65ch; }
  .card { margin-top: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
  .empty { margin-top: 18px; padding: 20px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 16px; }

  /* Barra de abas */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabbar button { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 58px; border: 0; background: transparent; font-size: 12px; font-weight: 700; color: var(--muted); }
  .tabbar button svg { width: 24px; height: 24px; }
  .tabbar button[aria-current="page"] { color: var(--accent); }

  /* Cronômetro de descanso */
  .rest {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar-bg); color: var(--bar-fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 24px rgba(0, 0, 0, .22);
  }
  body[data-tabs="1"] .rest { bottom: calc(58px + env(safe-area-inset-bottom, 0px)); padding-bottom: 0; }
  .rest-in { max-width: 560px; margin: 0 auto; padding: 12px 0 14px; }
  .rest-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .rest-track i { display: block; height: 100%; width: 100%; background: var(--bar-accent); }
  .rest-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .rest-info { flex: 1; min-width: 0; }
  .rest-label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .rest-time { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .rest-btn { height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, .35); background: transparent; color: var(--bar-fg); font-weight: 700; font-size: 14px; }

  let state = { routines: DEFAULT_ROUTINES(), sched: DEFAULT_SCHED(), custom: [], sessions: [], lastKg: {}, rest: 60 };

  /* ===== Histórico ===== */
  const setTxt = (it, x) => {
    if (it.kind !== 'sets') return x.done ? '✓' : '—';
    const r = x.reps || it.reps;
    if (it.bw) return r + (it.secs ? ' s' : ' reps');

  };
  function sessCard(s) {
    const t = sTot(s), v = vol(s);
    return '<button type="button" class="scard" style="' + themeOf(s.hue) + ';border-left:6px solid var(--dc)" data-act="sdet" data-sid="' + s.id + '">' +

      '<small>' + t.d + ' de ' + t.t + ' séries' + (v ? ' · volume ' + fmtN(v) + ' kg' : '') + '</small></button>';

  function calendar() {
    const now = new Date();
    const ym = nav.ym || { y: now.getFullYear(), m: now.getMonth() };
    nav.ym = ym;
    const first = new Date(ym.y, ym.m, 1), nd = new Date(ym.y, ym.m + 1, 0).getDate(), off = (first.getDay() + 6) % 7;
    const has = {};
    state.sessions.forEach((s) => { if (anyDone(s)) has[s.date] = 1; });
    let cells = '';
    ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].forEach((h) => { cells += '<div class="h">' + h + '</div>'; });
    for (let i = 0; i < off; i++) cells += '<button type="button" class="cd x" tabindex="-1" aria-hidden="true"></button>';
    for (let d = 1; d <= nd; d++) {
      const s = ym.y + '-' + pad(ym.m + 1) + '-' + pad(d);
      cells += '<button type="button" class="cd' + (has[s] ? ' has' : '') + (s === today() ? ' today' : '') + (nav.sel === s ? ' sel' : '') + '" data-act="day" data-date="' + s + '" aria-label="' + d + ' de ' + MONF[ym.m] + (has[s] ? ', com treino' : '') + '">' + d + '</button>';
    }
    return '<div class="cal"><div class="calh"><button type="button" class="ib" data-act="cal" data-d="-1" aria-label="Mês anterior">‹</button><b>' + MONF[ym.m] + ' ' + ym.y + '</b><button type="button" class="ib" data-act="cal" data-d="1" aria-label="Próximo mês">›</button></div><div class="calg">' + cells + '</div></div>';
  }
  function spark(vals) {
    if (vals.length < 2) return '';
    const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = mx - mn || 1;
    const pts = vals.map((v, i) => [10 + i * (280 / (vals.length - 1)), 50 - ((v - mn) / rg) * 40]);
    return '<svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts.map((p) => F1(p[0]) + ',' + F1(p[1])).join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      pts.map((p) => '<circle cx="' + F1(p[0]) + '" cy="' + F1(p[1]) + '" r="3.5" fill="var(--accent)"/>').join('') + '</svg>';
  }
  function renderHist() {
    const mode = nav.mode || 'date';
    const seg = '<div class="seg" role="group" aria-label="Modo"><button type="button" data-act="hmode" data-m="date" aria-pressed="' + (mode === 'date') + '">Por data</button><button type="button" data-act="hmode" data-m="ex" aria-pressed="' + (mode === 'ex') + '">Por exercício</button></div>';
    let body = '';
    if (mode === 'date') {
      const ym = nav.ym || { y: new Date().getFullYear(), m: new Date().getMonth() };
      let list;
      if (nav.sel) list = state.sessions.filter((s) => s.date === nav.sel);
      else list = state.sessions.filter((s) => { const d = pd(s.date); return d.getFullYear() === ym.y && d.getMonth() === ym.m; });
      list = list.filter((s) => anyDone(s) || s.fin).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
      body = calendar() +
        '<h4>' + (nav.sel ? dlabel(nav.sel) : 'Treinos de ' + MONF[ym.m]) + '</h4>' +
        (list.length ? '<div class="list" style="margin-top:0">' + list.map(sessCard).join('') + '</div>' : '<div class="empty">Nenhum treino registrado ' + (nav.sel ? 'neste dia' : 'neste mês') + '.</div>') +
        (nav.sel ? '<h4>Registrar treino em ' + dlabel(nav.sel) + '</h4><div class="gap">' + state.routines.map((r) => '<button type="button" class="btn block" data-act="startd" data-rid="' + r.id + '" data-date="' + nav.sel + '">' + esc(r.name) + '</button>').join('') + '</div><button type="button" class="btn small" style="margin-top:12px" data-act="clearsel">Ver o mês todo</button>' : '');
    } else {
      const map = {};
      state.sessions.forEach((s) => s.items.forEach((it) => { if (it.sets.some((x) => x.done)) map[it.ex] = it.name; }));
      const ids = Object.keys(map).sort((a, b) => map[a].localeCompare(map[b], 'pt'));
      if (!ids.length) body = '<div class="empty">Quando você registrar séries, a evolução de cada exercício aparece aqui.</div>';
      else {
        const sel = ids.indexOf(nav.hex) >= 0 ? nav.hex : ids[0];
        const rows = [];
        state.sessions.filter((s) => anyDone(s)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)).forEach((s) => {
          s.items.forEach((it) => { if (it.ex === sel && it.sets.some((x) => x.done)) rows.push({ s: s, it: it }); });
        });
        const vals = rows.map((r) => {
          const ds_ = r.it.sets.filter((x) => x.done);
          if (r.it.kind === 'sets' && !r.it.bw) return Math.max.apply(null, ds_.map((x) => num(x.kg)));
          if (r.it.kind === 'sets') return Math.max.apply(null, ds_.map((x) => num(x.reps || r.it.reps)));
          return ds_.length;
        });
        const unit = rows[0] && rows[0].it.kind === 'sets' ? (rows[0].it.bw ? (rows[0].it.secs ? 'maior tempo (s)' : 'mais repetições') : 'maior carga (kg)') : 'séries feitas';
        body = '<label class="lbl" for="hex">Exercício</label><select class="inp" id="hex" data-field="hex">' + ids.map((id) => '<option value="' + esc(id) + '"' + (id === sel ? ' selected' : '') + '>' + esc(map[id]) + '</option>').join('') + '</select>' +
          '<div class="card"><span class="eyebrow">Evolução · ' + unit + '</span>' + (vals.length > 1 ? spark(vals) : '<p style="margin-top:8px">Registre em mais de um dia para ver o gráfico.</p>') + '</div>' +
          '<h4>Registros</h4>' + rows.slice().reverse().map((r) => '<div class="hx"><b>' + dlabel(r.s.date) + '</b><small>' + r.it.sets.map((x, k) => x.done ? (k + 1) + 'ª: ' + setTxt(r.it, x) : '').filter(Boolean).join(' · ') + '</small></div>').join('');
      }
    }
    screen.innerHTML = '<div class="nav"></div><h1>Histórico</h1><p class="sub">Tudo que você treinou, organizado por data.</p><div style="margin-top:14px">' + seg + '</div>' + body;
  }

      '<div style="' + themeOf(s.hue) + '"><span class="eyebrow">' + dlabel(s.date) + (s.fin ? '' : ' · não concluído') + '</span><h2>' + esc(s.name) + '</h2>' +

      (flash ? '<div class="msg" role="status">' + esc(flash) + '</div>' : '') +

      '<h4>Descanso entre séries</h4><div class="seg" role="group" aria-label="Tempo de descanso">' +
      [45, 60, 90].map((s) => '<button type="button" data-act="restpick" data-v="' + s + '" aria-pressed="' + (state.rest === s) + '">' + s + ' s</button>').join('') + '</div>' +
      '<h4>Cópia de segurança</h4><div class="card"><p>Os dados ficam só neste aparelho e navegador. Copie o texto abaixo e guarde (por exemplo, mandando para você mesma) para recuperar o histórico em outro celular.</p>' +
      '<div class="gap"><button type="button" class="btn block" data-act="copy">Copiar meus dados</button>' +
      '<textarea class="inp" id="bk" placeholder="Para restaurar, cole aqui o texto copiado" aria-label="Dados para restaurar"></textarea>' +
      '<button type="button" class="btn block" data-act="restore">Restaurar a partir do texto</button></div></div>' +
      '<h4>Dados</h4><div class="gap"><button type="button" class="btn block danger" data-act="resetr">Restaurar os 4 treinos originais</button>' +
      '<button type="button" class="btn block danger" data-act="erase">Apagar todos os dados</button></div>' +
      '<details><summary>Dicas do plano</summary>' + tips + '</details>';
    flash = '';
  }

  /* ===== Render ===== */
  function render() {
    const v = nav.view;
    const f = { hoje: renderHoje, sess: renderSess, ex: renderEx, treinos: renderTreinos, lib: renderLib, exd: renderExd, newex: renderNewEx, edit: renderEdit, hist: renderHist, sdet: renderSdet, ajustes: renderAjustes }[v];
    (f || renderHoje)();
    const t = TABOF[v];
    $('#tabbar').hidden = v === 'ex';
    document.body.dataset.tabs = v === 'ex' ? '' : '1';
    document.querySelectorAll('#tabbar button').forEach((b) => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  }

  /* ===== Cronômetro de descanso ===== */
  let restEnd = 0, restTotal = 60, restTimer = null, hideT = null, ac = null;
  const restEl = $('#rest');
  const fmt = (s) => Math.floor(s / 60) + ':' + pad(s % 60);
  function unlockAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function beep() {
    try {
      if (ac) [0, 0.3].forEach((t) => {
        const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
        o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.25, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.22);
        o.start(s); o.stop(s + 0.25);
      });
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function hideRest() { clearInterval(restTimer); clearTimeout(hideT); restTimer = null; restEnd = 0; restEl.hidden = true; }
  function tick() {
    const left = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
    $('#restTime').textContent = fmt(left);
    $('#restFill').style.width = (restTotal ? Math.min(100, (left / restTotal) * 100) : 0) + '%';
    if (left <= 0) {
      clearInterval(restTimer); restTimer = null; restEnd = 0;
      $('#restLabel').textContent = 'Descanso acabou · próxima série';
      beep();
      hideT = setTimeout(hideRest, 6000);
    }
  }
  function startRest(sec) {
    unlockAudio();
    clearInterval(restTimer); clearTimeout(hideT);
    restTotal = sec; restEnd = Date.now() + sec * 1000;
    $('#restLabel').textContent = 'Descanso';
    restEl.hidden = false;
    tick();
    restTimer = setInterval(tick, 250);
  }
  restEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-r]');
    if (!b) return;
    const r = b.dataset.r;
    if (r === 'skip') { hideRest(); return; }
    if (!restEnd) return;
    restEnd = Math.max(Date.now() + 1000, restEnd + +r * 1000);
    restTotal = Math.max(restTotal, Math.ceil((restEnd - Date.now()) / 1000));
    tick();
  });

  /* Tela ligada durante o treino */
  let wl = null, started = false;
  function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wl) {
        navigator.wakeLock.request('screen').then((l) => { wl = l; l.addEventListener('release', () => { wl = null; }); }).catch(() => { wl = null; });
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && started) keepAwake(); });

  /* ===== Eventos ===== */
  function two(el, armedText, fn) {
    if (el.dataset.armed) { clearTimeout(+el.dataset.armed); fn(); return; }
    const old = el.textContent;
    el.textContent = armedText;
    el.classList.add('armed');
    el.dataset.armed = String(setTimeout(() => { el.textContent = old; el.classList.remove('armed'); delete el.dataset.armed; }, 4000));
  }
  const curSess = () => getS(nav.sid);
  const curRoutine = () => getR(nav.rid);
  function copyText(txt) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt); } catch (e) {}
    return Promise.reject();
  }

  $('#tabbar').addEventListener('click', (ev) => { const b = ev.target.closest('[data-tab]'); if (b) tab(b.dataset.tab); });

  screen.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const a = el.dataset.act;

    if (a === 'back') goBack();
    else if (a === 'start') { const s = openSessionFor(el.dataset.rid); if (s) go('sess', { sid: s.id }); }
    else if (a === 'startd') { const s = openSessionFor(el.dataset.rid, el.dataset.date); if (s) go('sess', { sid: s.id }); }
    else if (a === 'opens') go('sess', { sid: el.dataset.sid });
    else if (a === 'ex') go('ex', { sid: nav.sid, ex: +el.dataset.i });
    else if (a === 'prev') { if (nav.ex > 0) { nav = Object.assign({}, nav, { ex: nav.ex - 1 }); render(); window.scrollTo(0, 0); } }
    else if (a === 'next') {
      const s = curSess();
      if (s && nav.ex < s.items.length - 1) { nav = Object.assign({}, nav, { ex: nav.ex + 1 }); render(); window.scrollTo(0, 0); } else goBack();
    }
    else if (a === 'toggle') {
      const s = curSess(), e = s.items[nav.ex], i = +el.dataset.s, x = e.sets[i];
      x.done = !x.done;
      if (x.done && e.kind === 'sets') {
        if (x.reps === '') x.reps = String(e.reps);
        if (!e.bw) {
          if (x.kg === '') x.kg = (i > 0 && e.sets[i - 1].kg) || state.lastKg[e.ex] || '';
          if (x.kg) state.lastKg[e.ex] = x.kg;
        }
      }
      save();
      started = true; keepAwake();
      render();
      const t = sTot(s);
      if (t.d === t.t) hideRest();
      else if (x.done && e.kind === 'sets') startRest(state.rest);
    }
    else if (a === 'finish') {
      const s = curSess();
      s.fin = true; save(); hideRest();
      flash = 'Treino concluído e registrado em ' + dlabel(s.date) + '.';
      tab('hoje');
    }
    else if (a === 'reopen') { const s = curSess(); s.fin = false; save(); render(); }
    else if (a === 'restpick') {
      state.rest = +el.dataset.v; save();
      screen.querySelectorAll('[data-act="restpick"]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.v === state.rest ? 'true' : 'false'));
    }

    /* Treinos / editor */
    else if (a === 'newr') {
      const r = { id: uid(), name: 'Novo treino', hue: 1 + (state.routines.length % 4), items: [] };
      state.routines.push(r); save(); go('edit', { rid: r.id });
    }
    else if (a === 'editr') go('edit', { rid: el.dataset.rid });
    else if (a === 'hue') { const r = curRoutine(); r.hue = +el.dataset.h; save(); render(); }
    else if (a === 'up' || a === 'down') {
      const r = curRoutine(), i = +el.dataset.i, j = a === 'up' ? i - 1 : i + 1;
      if (j >= 0 && j < r.items.length) { const t = r.items[i]; r.items[i] = r.items[j]; r.items[j] = t; save(); render(); }
    }
    else if (a === 'rm') { const r = curRoutine(); r.items.splice(+el.dataset.i, 1); save(); render(); }
    else if (a === 'addex') go('lib', { pick: nav.rid });
    else if (a === 'dupr') {
      const r = curRoutine();
      const c = { id: uid(), name: r.name + ' (cópia)', hue: r.hue, items: r.items.map((it) => Object.assign({}, it)) };
      state.routines.push(c); save(); flash = 'Cópia criada. Você já pode editar.'; nav = { view: 'edit', rid: c.id }; render(); window.scrollTo(0, 0);
    }
    else if (a === 'delr') {
      two(el, 'Toque de novo para excluir', () => {
        const id = el.dataset.rid;
        state.routines = state.routines.filter((r) => r.id !== id);
        for (let w = 0; w < 7; w++) if (state.sched[w] === id) state.sched[w] = null;
        save(); flash = 'Treino excluído. O histórico foi mantido.'; tab('treinos');
      });
    }

    /* Acervo */
    else if (a === 'lib') go('lib', {});
    else if (a === 'gchip') { nav.g = el.dataset.g; render(); }
    else if (a === 'exd') go('exd', { exid: el.dataset.id });
    else if (a === 'pick') {
      const id = el.dataset.id;
      if (nav.pickS) {
        const s = getS(nav.pickS), k = s.items.findIndex((it) => it.ex === id);
        if (k >= 0) { if (!s.items[k].sets.some((x) => x.done)) s.items.splice(k, 1); }
        else { const e = getEx(id); if (e) s.items.push(snap(e)); }
      } else {
        const r = getR(nav.pick), k = r.items.findIndex((it) => it.ex === id);
        if (k >= 0) r.items.splice(k, 1); else r.items.push({ ex: id, sets: null, reps: null, d: null });
      }
      save();
      const y = window.scrollY; render(); window.scrollTo(0, y);
    }
    else if (a === 'addto') {
      const r = getR(el.dataset.rid);
      if (!r.items.some((it) => it.ex === nav.exid)) { r.items.push({ ex: nav.exid, sets: null, reps: null, d: null }); save(); flash = 'Adicionado a “' + r.name + '”.'; }
      else flash = 'Já está em “' + r.name + '”.';
      render();
    }
    else if (a === 'rmphoto') { delete fotos[el.dataset.id]; saveFotos(); flash = 'Foto removida.'; const y = window.scrollY; render(); window.scrollTo(0, y); }
    else if (a === 'sedit') { nav.edit = !nav.edit; render(); }
    else if (a === 'sadd') go('lib', { pickS: nav.sid });
    else if (a === 'swapr') {
      const s = curSess(), r = getR(el.dataset.rid);
      if (r) {
        const keep = s.items.filter((it) => it.sets.some((x) => x.done)), have = {};
        keep.forEach((it) => { have[it.ex] = 1; });
        s.items = rItems(r).filter((e) => !have[e.id]).map(snap).concat(keep);
        s.rid = r.id; s.name = r.name; s.hue = r.hue || 1; save();
        flash = 'Treino trocado para “' + r.name + '”.'; render(); window.scrollTo(0, 0);
      }
    }
    else if (a === 'sup' || a === 'sdown') {
      const s = curSess(), i = +el.dataset.i, j = a === 'sup' ? i - 1 : i + 1;
      if (j >= 0 && j < s.items.length) { const t = s.items[i]; s.items[i] = s.items[j]; s.items[j] = t; save(); render(); }
    }
    else if (a === 'srm') { const s = curSess(), it = s.items[+el.dataset.i]; if (it && !it.sets.some((x) => x.done)) { s.items.splice(+el.dataset.i, 1); save(); render(); } }
    else if (a === 'savert') {
      const s = curSess(), r = getR(s.rid);
      if (r) two(el, 'Toque de novo para guardar', () => {
        r.items = s.items.map((it) => ({ ex: it.ex, sets: it.sets.length, reps: it.kind === 'sets' ? (+it.reps || null) : null, d: it.kind === 'sets' ? null : (it.detail || null) }));
        save(); flash = 'Treino “' + r.name + '” atualizado com esta lista.'; render();
      });
    }
    else if (a === 'newex') go('newex', {});
    else if (a === 'savex') {
      const name = $('#nx-name').value.trim(), msg = $('#nx-msg');
      if (!name) { msg.textContent = 'Dê um nome ao exercício.'; msg.hidden = false; return; }
      const kd = $('#nx-k').value, kind = kd === 'timed' ? 'timed' : 'sets';
      const e = { id: 'c' + uid(), g: $('#nx-g').value, name: name, kind: kind, custom: true, tip: $('#nx-t').value.trim(), per: '' };
      if (kind === 'sets') { e.sets = Math.max(1, Math.min(10, parseInt($('#nx-s').value, 10) || 3)); e.reps = Math.max(1, parseInt($('#nx-r').value, 10) || 12); if (kd === 'bw') e.bw = true; }
      else e.detail = $('#nx-d').value.trim() || '15 min';
      state.custom.push(e); save();
      flash = 'Exercício criado.';
      goBack();
    }
    else if (a === 'delx') {
      two(el, 'Toque de novo para excluir', () => {
        const id = el.dataset.id;
        state.custom = state.custom.filter((e) => e.id !== id);
        state.routines.forEach((r) => { r.items = r.items.filter((it) => it.ex !== id); });
        save(); goBack();
      });
    }

    /* Histórico */
    else if (a === 'hmode') { nav.mode = el.dataset.m; render(); }
    else if (a === 'cal') {
      const ym = nav.ym || { y: new Date().getFullYear(), m: new Date().getMonth() }, d = new Date(ym.y, ym.m + +el.dataset.d, 1);
      nav.ym = { y: d.getFullYear(), m: d.getMonth() }; nav.sel = null; render();
    }
    else if (a === 'day') { nav.sel = nav.sel === el.dataset.date ? null : el.dataset.date; render(); }
    else if (a === 'clearsel') { nav.sel = null; render(); }
    else if (a === 'sdet') go('sdet', { sid: el.dataset.sid });
    else if (a === 'dels') {
      two(el, 'Toque de novo para excluir', () => {
        const id = el.dataset.sid;
        state.sessions = state.sessions.filter((s) => s.id !== id); save(); goBack();
      });
    }

    /* Ajustes */
    else if (a === 'copy') {
      const txt = JSON.stringify(Object.assign({}, state, { fotos: fotos }));
      const ta = $('#bk');
      copyText(txt).then(() => { el.textContent = 'Copiado!'; setTimeout(() => { el.textContent = 'Copiar meus dados'; }, 2000); }).catch(() => { ta.value = txt; ta.focus(); ta.select(); el.textContent = 'Selecione e copie o texto abaixo'; });
    }
    else if (a === 'restore') {
      const raw = $('#bk').value.trim();
      let c = null, parsed = null;
      try { parsed = JSON.parse(raw); c = clean(parsed); } catch (e) {}
      if (!c) { flash = 'Não consegui ler esse texto. Cole exatamente o que foi copiado.'; render(); return; }
      two(el, 'Toque de novo: isto substitui os dados atuais', () => { state = c; save(); if (parsed && parsed.fotos && typeof parsed.fotos === 'object') { fotos = parsed.fotos; saveFotos(); } flash = 'Dados restaurados.'; render(); });
    }
    else if (a === 'resetr') {
      two(el, 'Toque de novo para restaurar', () => { state.routines = DEFAULT_ROUTINES(); state.sched = DEFAULT_SCHED(); save(); flash = 'Os 4 treinos originais voltaram. O histórico foi mantido.'; render(); });
    }
    else if (a === 'erase') {
      two(el, 'Toque de novo para apagar tudo', () => {
        state = { routines: DEFAULT_ROUTINES(), sched: DEFAULT_SCHED(), custom: [], sessions: [], lastKg: {}, rest: 60 };
        save(); fotos = {}; saveFotos(); hideRest(); flash = 'Todos os dados foram apagados.'; render();
      });
    }
  });

  screen.addEventListener('input', (ev) => {
    const inp = ev.target.closest('[data-field]');
    if (!inp) return;
    const f = inp.dataset.field;
    if (f === 'kg' || f === 'reps') {
      const s = curSess(), e = s.items[nav.ex], x = e.sets[+inp.dataset.s];
      let v = inp.value;
      if (f === 'kg') { v = v.replace(',', '.').replace(/[^0-9.]/g, ''); if (v !== inp.value) inp.value = v; x.kg = v; if (v && x.done) state.lastKg[e.ex] = v; }
      else { v = v.replace(/[^0-9]/g, ''); if (v !== inp.value) inp.value = v; x.reps = v; }
      save();
    }
    else if (f === 'lq') { nav.q = inp.value; $('#liblist').innerHTML = libList(); }
    else if (f === 'sname') { const s = curSess(); s.name = inp.value.slice(0, 50) || 'Treino'; save(); }
    else if (f === 'rname') { const r = curRoutine(); r.name = inp.value.slice(0, 50) || 'Treino'; save(); }
    else if (f === 'esets' || f === 'ereps') {
      const r = curRoutine(), it = r.items[+inp.dataset.i];
      const v = inp.value.replace(/[^0-9]/g, ''); if (v !== inp.value) inp.value = v;
      it[f === 'esets' ? 'sets' : 'reps'] = v ? Math.min(+v, f === 'esets' ? 20 : 999) : null; save();
    }
    else if (f === 'edetail') { const r = curRoutine(); r.items[+inp.dataset.i].d = inp.value.slice(0, 60) || null; save(); }
  });
  screen.addEventListener('change', (ev) => {
    const inp = ev.target.closest('[data-field]');
    if (!inp) return;
    const f = inp.dataset.field;
    if (f === 'photo') { const file = inp.files && inp.files[0]; if (file) readPhoto(file, inp.dataset.id); return; }
    if (f === 'date') {
      const s = curSess();
      if (inp.value && /^\d{4}-\d{2}-\d{2}$/.test(inp.value)) { s.date = inp.value > today() ? today() : inp.value; save(); }
      render();
    }
    else if (f === 'sched') { state.sched[+inp.dataset.wd] = inp.value || null; save(); }
    else if (f === 'hex') { nav.hex = inp.value; render(); }
  });

  render();
})();
</script>

</body>
</html>

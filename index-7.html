<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino da Semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
  /* Layout: três telas empilhadas (início, dia, exercício). Cada dia tem uma cor própria que acompanha seus grupos musculares. */
  :root {
    --bg: #EEF0F5;
    --surface: #FFFFFF;
    --ink: #141A2E;
    --muted: #5B647C;
    --line: #D9DEEA;
    --accent: #2B4BEE;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4E9FE;
    --ok: #12805C;
    --on-ok: #FFFFFF;
    --d1: #2B4BEE;
    --d2: #0B8580;
    --d3: #BE3475;
    --d4: #B3680A;
    --on-d: #FFFFFF;
    --bar-bg: #141A2E;
    --bar-fg: #F2F4FB;
    --bar-accent: #93A5FF;
    --bar-accent-ink: #0B1030;
    --display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
    --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1320;
      --surface: #181D2E;
      --ink: #EDF0F8;
      --muted: #9AA3BC;
      --line: #2A3148;
      --accent: #8196FF;
      --accent-ink: #0B1030;
      --accent-soft: #212A55;
      --ok: #4FD0A1;
      --on-ok: #06261D;
      --d1: #8196FF;
      --d2: #3CC7C0;
      --d3: #F27DB0;
      --d4: #F2B04C;
      --on-d: #0F1320;
      --bar-bg: #2A3148;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1320;
    --surface: #181D2E;
    --ink: #EDF0F8;
    --muted: #9AA3BC;
    --line: #2A3148;
    --accent: #8196FF;
    --accent-ink: #0B1030;
    --accent-soft: #212A55;
    --ok: #4FD0A1;
    --on-ok: #06261D;
    --d1: #8196FF;
    --d2: #3CC7C0;
    --d3: #F27DB0;
    --d4: #F2B04C;
    --on-d: #0F1320;
    --bar-bg: #2A3148;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    background: var(--bg); color: var(--ink);
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  button, input, summary { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }

  .app { max-width: 520px; margin-inline: auto; padding-top: 8px; padding-bottom: 150px; }

  .nav { display: flex; align-items: center; min-height: 52px; }
  .back {
    display: inline-flex; align-items: center; gap: 4px; height: 44px; margin-left: -8px; padding: 0 12px 0 6px;
    border: 0; background: transparent; color: var(--accent); font-weight: 700;
  }
  .back svg { width: 20px; height: 20px; }

  h1, h2 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; line-height: 1.04; text-wrap: balance; margin: 0; }
  h1 { font-size: 40px; }
  h2 { font-size: 30px; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

  .weekbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 16px; }
  .weekbar i { height: 8px; border-radius: 4px; background: var(--line); }
  .weekbar i.on { background: var(--ok); }

  /* Cartões dos dias */
  .cards { display: grid; gap: 12px; margin-top: 22px; }
  .card {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) 20px; gap: 14px; align-items: center;
    width: 100%; text-align: left; padding: 14px 14px 14px 14px;
    border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
  }
  .badge {
    width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
    background: var(--dc); color: var(--on-d); font-family: var(--display); font-weight: 800; font-size: 28px;
  }
  .badge svg { width: 28px; height: 28px; }
  .card strong { display: block; margin-top: 2px; font-size: 18px; line-height: 1.2; }
  .card .meta { display: block; margin-top: 2px; font-size: 14px; color: var(--muted); }
  .card .chev { width: 20px; height: 20px; color: var(--muted); }
  .pill { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; letter-spacing: .06em; vertical-align: 1px; }
  .track { height: 6px; margin-top: 10px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--dc); transition: width .25s ease; }

  /* Dicas e reinício */
  details { margin-top: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  summary { display: flex; align-items: center; min-height: 52px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  details[open] summary { border-bottom: 1px solid var(--line); }
  .tip-item { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .tip-item:last-of-type { border-bottom: 0; }
  .tip-item b { display: block; margin-bottom: 2px; font-size: 14px; }
  .tip-item p { margin: 0; color: var(--muted); font-size: 15px; max-width: 65ch; }
  .reset-wrap { padding: 4px 16px 16px; }
  .note { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px;
    border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; font-size: 16px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.block { width: 100%; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.small { min-height: 44px; font-size: 15px; }

  /* Tela do dia */
  .dayhead { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; margin-top: 4px; }
  .dayhead .badge { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; }
  .tag::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--dc); }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .prog .track { flex: 1; margin: 0; height: 8px; }
  .prog span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cta { margin-top: 18px; }
  .banner { margin-top: 18px; padding: 16px; border-radius: 16px; background: var(--ok); color: var(--on-ok); font-weight: 700; }
  .rows { display: grid; gap: 8px; margin-top: 18px; }
  .thumb { display: block; width: 64px; border-radius: 10px; background: var(--bg); overflow: hidden; }
  .thumb svg, .panel svg { display: block; width: 100%; height: auto; }
  .row.done .thumb { opacity: .55; }
  .demo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .demo.n1 { grid-template-columns: minmax(0, 280px); justify-content: center; }
  .panel { margin: 0; padding: 6px 6px 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .panel figcaption { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .demo-note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .vid { margin-top: 14px; color: var(--ink); text-decoration: none; }
  .row {
    display: grid; grid-template-columns: 36px minmax(0, 1fr) 64px; gap: 12px; align-items: center;
    width: 100%; min-height: 64px; padding: 10px 14px; text-align: left;
    border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  }
  .row .n {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
  }
  .row .n svg { display: none; width: 18px; height: 18px; }
  .row.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .row.done .n span { display: none; }
  .row.done .n svg { display: block; }
  .row b { display: block; font-size: 16px; line-height: 1.25; }
  .row small { display: block; margin-top: 1px; font-size: 13px; color: var(--muted); }
  .row .st { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row.part .st { color: var(--accent); font-weight: 700; }

  /* Tela do exercício */
  .exhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 2px; }
  .dots { display: flex; gap: 4px; margin-top: 12px; }
  .dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .dots i.on { background: var(--ok); }
  .dots i.cur { background: var(--dc); }
  .exname { margin-top: 18px; }
  .target { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; }
  .target b { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -.02em; color: var(--dc); font-variant-numeric: tabular-nums; }
  .target span { font-size: 16px; color: var(--muted); }
  .tip { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); }
  .tip p { margin: 4px 0 0; max-width: 65ch; }
  .sets { display: grid; gap: 10px; margin-top: 22px; }
  .sethead, .set { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
  .sethead.bw, .set.bw { grid-template-columns: 34px minmax(0, 1fr) 56px; }
  .sethead span { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .sethead span:first-child { text-align: left; }
  .set .no { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); }
  .set input {
    width: 100%; min-width: 0; height: 56px; padding: 0 8px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface);
    font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums;
  }
  .set input::placeholder { color: var(--muted); opacity: .55; }
  .set.done input { border-color: var(--ok); }
  .tick {
    width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .tick svg { width: 26px; height: 26px; }
  .set.done .tick { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .big {
    display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 72px; margin-top: 22px;
    border: 1.5px solid var(--line); border-radius: 18px; background: var(--surface); font-weight: 700; font-size: 18px;
  }
  .big svg { width: 28px; height: 28px; }
  .big.on { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .rounds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 22px; }
  .rd { height: 56px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .rd[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
  .exnav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 26px; }

  /* Cronômetro de descanso */
  .rest {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar-bg); color: var(--bar-fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 24px rgba(0, 0, 0, .22);
  }
  .rest-in { max-width: 520px; margin: 0 auto; padding: 12px 0 14px; }
  .rest-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .rest-track i { display: block; height: 100%; width: 100%; background: var(--bar-accent); }
  .rest-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .rest-info { flex: 1; min-width: 0; }
  .rest-label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .rest-time { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .rest-btn { height: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, .35); background: transparent; color: var(--bar-fg); font-weight: 700; font-size: 14px; }
  .rest-btn.primary { background: var(--bar-accent); border-color: var(--bar-accent); color: var(--bar-accent-ink); }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; min-height: 40px; padding: 0 14px; font-size: 14px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .restpick { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; font-size: 15px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
  @media (max-width: 380px) { h1 { font-size: 34px; } h2 { font-size: 26px; } .target b { font-size: 40px; } }
</style>
</head>
<body>
<div class="app"><main id="screen"></main></div>

<div class="rest" id="rest" hidden>
  <div class="rest-in">
    <div class="rest-track"><i id="restFill"></i></div>
    <div class="rest-row">
      <div class="rest-info"><span class="rest-label" id="restLabel" role="status">Descanso</span><span class="rest-time" id="restTime">1:00</span></div>
      <button type="button" class="rest-btn" data-r="-15">−15 s</button>
      <button type="button" class="rest-btn" data-r="15">+15 s</button>
      <button type="button" class="rest-btn primary" data-r="skip">Pular</button>
    </div>
  </div>
</div>

<script>
(function () {
  const KEY = 'treino-v2', OLD = 'treino-semana-v1';
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="5,13 10,18 19,7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHEV = '<svg viewBox="0 0 20 20" aria-hidden="true"><polyline points="7,4 13,10 7,16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const BACK = '<svg viewBox="0 0 20 20" aria-hidden="true"><polyline points="13,4 7,10 13,16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const X = (id, name, sets, reps, tip, per, o) => Object.assign({ id, name, kind: 'sets', sets, reps, per: per || '', tip }, o || {});
  const ABS = { bw: true };
  const ABS_S = { bw: true, secs: true };
  const AQ = { id: 'aq', kind: 'timed', name: 'Aquecimento', detail: '5 a 10 min de bike ou esteira', tip: 'Ritmo leve, só para esquentar as articulações e soltar os músculos. Não é para cansar.' };

  const DAYS = [
    { id: 'd1', n: 1, title: 'Quadríceps e panturrilha', tags: ['Quadríceps', 'Panturrilha'], time: '45 min', ex: [
      AQ,
      X('agach', 'Agachamento no smith', 3, 12, 'Pés um pouco à frente da barra, na largura dos ombros. Desça até as coxas ficarem paralelas ao chão, com os joelhos na direção dos pés.'),
      X('leg', 'Leg press 45°', 3, 12, 'Lombar colada no banco e pés na largura dos ombros. Desça até o joelho formar cerca de 90° e não trave o joelho lá em cima.'),
      X('ext', 'Cadeira extensora', 3, 15, 'Estenda as pernas sem dar impulso, segure 1 segundo no topo e volte devagar.'),
      X('pant', 'Panturrilha em pé', 3, 20, 'Suba o máximo que conseguir e desça alongando bem, sem quicar.'),
      X('pants', 'Panturrilha sentada', 3, 20, 'Movimento completo: alongue embaixo e segure 1 segundo no alto.'),
      { id: 'esteira', kind: 'timed', name: 'Esteira inclinada', detail: '15 a 20 min com inclinação', tip: 'Caminhada firme com inclinação. Não segure no apoio da esteira.' }
    ]},
    { id: 'd2', n: 2, title: 'Costas e bíceps', tags: ['Costas', 'Bíceps', 'Abdômen'], time: '55 min', ex: [
      AQ,
      X('puxada', 'Puxada frontal', 3, 12, 'Peito aberto, puxe a barra até a altura do queixo levando os cotovelos para baixo. Não balance o tronco.'),
      X('remb', 'Remada baixa', 3, 12, 'Coluna reta, puxe os cotovelos para trás e aperte as escápulas no final.'),
      X('remu', 'Remada unilateral com halter', 3, 12, 'Apoie a mão e o joelho no banco, costas retas. Puxe o cotovelo em direção ao quadril.', 'por lado'),
      X('rosca', 'Rosca direta', 3, 12, 'Cotovelos colados ao corpo. Suba sem balançar o tronco e desça devagar.'),
      X('martelo', 'Rosca martelo', 3, 12, 'Palmas das mãos de frente uma para a outra durante todo o movimento.'),
      X('infra', 'Elevação de pernas (abdominal infra)', 3, 15, 'Deitada, com a lombar colada no chão. Suba as pernas até a vertical e desça devagar, sem encostar os pés. Se a lombar levantar, dobre os joelhos.', '', ABS),
      X('prancha', 'Prancha', 3, 30, 'Apoie os antebraços e as pontas dos pés, com o corpo reto da cabeça aos calcanhares. Abdômen contraído, sem deixar o quadril cair.', '', ABS_S),
      { id: 'bike', kind: 'timed', name: 'Bicicleta', detail: '15 a 20 min em ritmo moderado', tip: 'Ritmo em que dá para falar frases curtas, mas sem conseguir cantar.' }
    ]},
    { id: 'd3', n: 3, title: 'Glúteos e posteriores', tags: ['Glúteos', 'Posteriores de coxa'], time: '50 min', ex: [
      AQ,
      X('pelv', 'Elevação pélvica', 3, 12, 'Pés apoiados no chão, suba o quadril apertando os glúteos e segure 1 segundo em cima.'),
      X('stiff', 'Stiff com halteres', 3, 12, 'Joelhos levemente dobrados, leve o quadril para trás com a coluna reta e os halteres perto das pernas.'),
      X('flex', 'Mesa flexora', 3, 15, 'Quadril colado no banco. Flexione as pernas e volte devagar.'),
      X('sumo', 'Agachamento sumô', 3, 12, 'Pés bem abertos e pontas para fora. Desça entre as pernas com o tronco ereto.'),
      X('coice', 'Glúteo na polia (coice)', 3, 12, 'Estenda a perna para trás sem arquear a lombar. Controle a volta.', 'por perna'),
      X('abdut', 'Cadeira abdutora', 3, 15, 'Tronco encostado no banco. Abra as pernas sem impulso e volte controlando.'),
      { id: 'bike', kind: 'timed', name: 'Bicicleta ou elíptico', detail: '20 min em ritmo moderado', tip: 'Ritmo constante, em que dá para falar frases curtas.' }
    ]},
    { id: 'd4', n: 4, title: 'Peito, ombros e tríceps', tags: ['Peito', 'Ombros', 'Tríceps', 'Abdômen'], time: '60 min', ex: [
      AQ,
      X('supino', 'Supino na máquina', 3, 12, 'Ombros para trás e encostados no banco. Empurre sem travar os cotovelos.'),
      X('supinc', 'Supino inclinado com halteres', 3, 12, 'Banco inclinado entre 30° e 45°. Desça os halteres até a linha do peito.'),
      X('desenv', 'Desenvolvimento com halteres', 3, 12, 'Sentada, empurre os halteres acima da cabeça sem arquear a lombar.'),
      X('lateral', 'Elevação lateral', 3, 12, 'Carga leve, cotovelos levemente dobrados. Suba até a altura dos ombros e desça devagar.'),
      X('tricps', 'Tríceps na polia', 3, 12, 'Cotovelos fixos ao lado do corpo. Estenda os braços por completo.'),
      X('frances', 'Tríceps francês com halter', 2, 12, 'Cotovelos apontando para cima e perto da cabeça. Desça o halter atrás da cabeça e estenda.'),
      X('supra', 'Abdominal supra', 3, 15, 'Deitada, joelhos dobrados e mãos ao lado da cabeça, sem puxar o pescoço. Suba só os ombros do chão contraindo o abdômen e desça devagar.', '', ABS),
      X('plat', 'Prancha lateral', 3, 20, 'Apoie um antebraço no chão com o corpo alinhado de lado. Mantenha o quadril elevado. Faça os dois lados em cada série.', 'por lado', ABS_S),
      { id: 'hiit', kind: 'rounds', name: 'HIIT na esteira ou bike', sets: 10, detail: '10 rodadas de 30 s forte + 60 s leve', tip: 'Nos 30 s fortes, vá em um ritmo que você não manteria por mais de 1 minuto. Nos 60 s, diminua até recuperar o fôlego.' }
    ]}
  ];

  const TIPS = [
    ['Descanso entre séries', 'Entre 45 e 60 segundos. O cronômetro abre sozinho ao marcar uma série.'],
    ['Progressão', 'Quando as repetições ficarem fáceis, aumente a carga um pouco. Faça isso a cada 2 ou 3 semanas.'],
    ['Dias sem treino', 'Caminhe de 30 a 40 minutos. Ajuda no gasto calórico e não atrapalha a recuperação.'],
    ['Alimentação e sono', 'O déficit calórico vem principalmente da dieta. Combine o treino com proteína suficiente e 7 a 8 horas de sono.'],
    ['Segurança', 'Com lesões ou condições de saúde, procure liberação médica. Peça a um profissional da academia para corrigir a execução.']
  ];

  /* Ilustrações: figura de lado montada a partir de ângulos (0° = segmento para baixo, positivo = para a frente) */
  const FLOOR = 108, RAD = Math.PI / 180;
  const F1 = (n) => n.toFixed(1);
  const dn = (a) => [Math.sin(a * RAD), Math.cos(a * RAD)];
  const upv = (b) => [Math.sin(b * RAD), -Math.cos(b * RAD)];
  const add = (P, v, l) => [P[0] + v[0] * l, P[1] + v[1] * l];
  const unit = (a, b) => { const x = b[0] - a[0], y = b[1] - a[1], l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
  const W = (o) => Object.assign({ b: 0, ua: 0, fa: 0, th: 0, sa: 0, ft: 90, hd: 0 }, o);

  const ln = (a, b, o) => { o = o || {}; return '<line x1="' + F1(a[0]) + '" y1="' + F1(a[1]) + '" x2="' + F1(b[0]) + '" y2="' + F1(b[1]) + '" stroke="' + (o.c || 'var(--muted)') + '" stroke-width="' + (o.w || 3) + '" stroke-linecap="round"' + (o.d ? ' stroke-dasharray="' + o.d + '"' : '') + (o.op ? ' opacity="' + o.op + '"' : '') + '/>'; };
  const ci = (P, r, f) => '<circle cx="' + F1(P[0]) + '" cy="' + F1(P[1]) + '" r="' + r + '" fill="' + (f || 'var(--dc)') + '"/>';
  const dbEnd = (P) => ci(P, 5);
  const dbSide = (P) => ln([P[0] - 8, P[1]], [P[0] + 8, P[1]], { c: 'var(--dc)', w: 3 }) + ci([P[0] - 8, P[1]], 3.5) + ci([P[0] + 8, P[1]], 3.5);
  const barEnd = (P) => ci(P, 7) + ci(P, 3, 'var(--surface)');
  const back = (J, ext) => { const t = unit(J.hip, J.S), n = [t[1], -t[0]]; return ln(add(J.hip, n, 8), add(add(J.S, t, ext == null ? 12 : ext), n, 8), { w: 5 }); };
  const seat = (J) => ln([J.hip[0] - 12, J.hip[1] + 5], [J.hip[0] + 12, J.hip[1] + 5], { w: 5 }) + ln([J.hip[0] - 2, J.hip[1] + 5], [J.hip[0] - 2, FLOOR + 2], { w: 3 });
  const cable = (a, b) => ln(a, b, { w: 1.5, d: '3 3' });

  const fk = (p) => {
    const hip = [0, 0], S = add(hip, upv(p.b), 30), head = add(S, upv(p.b + p.hd), 13);
    const E = add(S, dn(p.ua), 17), H = add(E, dn(p.fa), 16);
    const K = add(hip, dn(p.th), 25), A = add(K, dn(p.sa), 25), T = add(A, dn(p.ft), 8);
    const J = { hip, S, head, E, H, K, A, T };
    if (p.l2) { J.K2 = add(hip, dn(p.l2[0]), 25); J.A2 = add(J.K2, dn(p.l2[1]), 25); J.T2 = add(J.A2, dn(p.l2[2] == null ? 90 : p.l2[2]), 8); }
    return J;
  };
  const place = (Js, o) => {
    let mn = 1e9, mx = -1e9;
    Js.forEach((J) => Object.keys(J).forEach((k) => { mn = Math.min(mn, J[k][0]); mx = Math.max(mx, J[k][0]); }));
    const dx = 80 - (mn + mx) / 2;
    const low = (J) => Math.max.apply(null, Object.keys(J).map((k) => J[k][1] + (k === 'head' ? 7 : 0)));
    const base = o.g === 'hip' ? FLOOR - low(Js[0]) - (o.lift || 0) : null;
    return Js.map((J) => { const dy = base != null ? base : FLOOR - low(J), r = {}; Object.keys(J).forEach((k) => { r[k] = [J[k][0] + dx, J[k][1] + dy]; }); return r; });
  };
  const pl = (pts, op) => '<polyline points="' + pts.map((q) => F1(q[0]) + ',' + F1(q[1])).join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"' + (op ? ' opacity="' + op + '"' : '') + '/>';
  const bodySvg = (J) => (J.K2 ? pl([J.hip, J.K2, J.A2, J.T2], 0.45) : '') + pl([J.hip, J.K, J.A, J.T]) + pl([J.hip, J.S, J.head]) + pl([J.S, J.E, J.H]) +
    '<circle cx="' + F1(J.head[0]) + '" cy="' + F1(J.head[1]) + '" r="7" fill="var(--surface)" stroke="var(--ink)" stroke-width="3.5"/>';
  const wrapSvg = (inner) => '<svg viewBox="0 0 160 120" aria-hidden="true"><line x1="10" y1="' + (FLOOR + 3) + '" x2="150" y2="' + (FLOOR + 3) + '" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/>' + inner + '</svg>';

  /* Figura de frente (abdutora, sumô, elevação lateral) */
  const front = (o) => {
    const cx = 80, shY = o.hipY - 32, headY = shY - 12;
    let s = '';
    [-1, 1].forEach((k) => { s += pl([[cx + k * 6, o.hipY], [cx + k * o.kneeX, o.kneeY], [cx + k * o.footX, FLOOR - 2]]); });
    s += pl([[cx, shY], [cx, o.hipY]]) + pl([[cx - 13, shY], [cx + 13, shY]]) + pl([[cx - 6, o.hipY], [cx + 6, o.hipY]]);
    [-1, 1].forEach((k) => {
      const sx = cx + k * 13;
      const e = o.armEnd ? [cx + k * o.armEnd[0], o.armEnd[1]] : [sx + k * Math.sin(o.armA * RAD) * 33, shY + Math.cos(o.armA * RAD) * 33];
      s += pl([[sx, shY], e]);
      if (o.wt) s += ci(e, 5);
    });
    if (o.wt1) s += '<rect x="' + (o.wt1[0] - 8) + '" y="' + (o.wt1[1] - 5) + '" width="16" height="10" rx="3" fill="var(--dc)"/>';
    s += '<circle cx="' + cx + '" cy="' + headY + '" r="7" fill="var(--surface)" stroke="var(--ink)" stroke-width="3.5"/>';
    return (o.pre || '') + s + (o.post || '');
  };
  const padsAt = (kx) => [-1, 1].map((k) => ln([80 + k * (kx + 8), 84], [80 + k * (kx + 8), 100], { w: 5 })).join('');

  const WALK = [W({ b: 8, ua: 32, fa: 62, th: 28, sa: 6, l2: [-18, -36] }), W({ b: 8, ua: -30, fa: 12, th: -18, sa: -36, l2: [28, 6] })];
  const WALK_INC = WALK.map((p) => Object.assign({}, p, { b: 15 }));
  const RUN = [W({ b: 18, ua: 55, fa: 150, th: 62, sa: -48, l2: [-38, -72] }), W({ b: 18, ua: -50, fa: 25, th: -38, sa: -72, l2: [62, -48] })];
  const BB = (J) => [J.hip[0] + 16, J.hip[1] + 40];

  const EXV = {
    aq: { p: WALK, lb: ['Passo 1', 'Passo 2'] },
    esteira: { p: WALK_INC, lb: ['Passo 1', 'Passo 2'] },
    hiit: { p: [RUN[0], WALK[0]], lb: ['30 s forte', '60 s leve'] },
    bike: { g: 'hip', lb: ['Pedal embaixo', 'Pedal à frente'],
      p: [W({ b: 42, ua: 42, fa: 80, th: 22, sa: -5, l2: [80, 40] }), W({ b: 42, ua: 42, fa: 80, th: 80, sa: 40, l2: [22, -5] })],
      bk: (J) => '<circle cx="' + F1(BB(J)[0]) + '" cy="' + F1(BB(J)[1]) + '" r="14" fill="none" stroke="var(--line)" stroke-width="2.5"/>' +
        ln([J.hip[0] - 10, J.hip[1] + 5], [J.hip[0] + 4, J.hip[1] + 5], { w: 4 }) + ln([J.hip[0] - 2, J.hip[1] + 5], BB(J)) + ln(BB(J), [J.H[0] + 3, J.H[1] + 8]),
      fr: (J) => ci(J.H, 3, 'var(--muted)') },
    agach: { p: [W({ b: 3, ua: 20, fa: -110 }), W({ b: 38, ua: 20, fa: -110, th: 85, sa: -22 })],
      bk: (J) => ln([J.S[0] - 3, 10], [J.S[0] - 3, FLOOR + 2], { w: 2, op: 0.5 }),
      fr: (J) => barEnd([J.S[0] - 3, J.S[1] - 1]) },
    leg: { g: 'hip', lift: 8,
      p: [W({ b: -48, ua: 60, fa: 100, th: 170, sa: 80, ft: 170 }), W({ b: -48, ua: 60, fa: 100, th: 135, sa: 138, ft: 228 })],
      bk: (J) => { const d = unit(J.hip, J.A), n = [-d[1], d[0]]; return back(J, 6) + ln([J.hip[0] - 10, J.hip[1] + 6], [J.hip[0] + 10, J.hip[1] + 6], { w: 5 }) + ln(add(J.A, n, 14), add(J.A, n, -14), { c: 'var(--dc)', w: 5 }); } },
    ext: { g: 'hip', p: [W({ b: -5, ua: 15, fa: 70, th: 90, sa: 0 }), W({ b: -5, ua: 15, fa: 70, th: 90, sa: 88, ft: 178 })],
      bk: (J) => seat(J) + back(J, 14), fr: (J) => ci([J.A[0], J.A[1] - 4], 4, 'var(--dc)') },
    pant: { p: [W({}), W({ ft: 42 })], fr: () => '' },
    pants: { p: [W({ ua: 15, fa: 40, th: 85 }), W({ ua: 15, fa: 40, th: 85, ft: 42 })],
      bk: (J) => seat(J) + back(J, 14), fr: (J) => ci([J.K[0], J.K[1] - 6], 6, 'var(--dc)') },
    puxada: { g: 'hip', p: [W({ b: -8, ua: 168, fa: 170, th: 90, sa: 0 }), W({ b: -12, ua: -25, fa: 150, th: 90, sa: 0 })],
      bk: (J) => seat(J) + back(J, 14) + ln([J.K[0] - 6, J.K[1] - 8], [J.K[0] + 4, J.K[1] - 8], { w: 5 }),
      fr: (J) => cable(J.H, [J.H[0] + 3, 6]) + ci(J.H, 3.5) },
    remb: { g: 'hip', p: [W({ b: 12, ua: 80, fa: 85, th: 80, sa: 60, ft: 150 }), W({ b: -5, ua: -55, fa: 100, th: 80, sa: 60, ft: 150 })],
      bk: (J) => seat(J) + ln([J.A[0] + 10, J.A[1] - 16], [J.A[0] + 10, J.A[1] + 2], { w: 4 }),
      fr: (J) => cable(J.H, [152, J.H[1]]) + ci(J.H, 3.5) },
    remu: { p: [W({ b: 78, ua: -5, fa: -5, th: 14, sa: -14 }), W({ b: 78, ua: -114, fa: -5, th: 14, sa: -14 })], fr: (J) => dbEnd(J.H) },
    rosca: { p: [W({ ua: 3, fa: 3 }), W({ ua: 3, fa: 152 })], fr: (J) => dbEnd(J.H) },
    martelo: { p: [W({ ua: 3, fa: 3 }), W({ ua: 3, fa: 152 })], fr: (J) => dbSide(J.H) },
    infra: { g: 'hip', p: [W({ b: -90, ua: 90, fa: 90, th: 90, sa: 90, ft: 180 }), W({ b: -90, ua: 90, fa: 90, th: 176, sa: 178, ft: 268 })],
      bk: (J) => back(J, 8) },
    prancha: { lb: ['Posição'], p: [W({ b: 83, ua: 0, fa: 90, th: -83, sa: -83, ft: 20 })] },
    pelv: { p: [W({ b: -90, ua: 80, fa: 80, th: 135, sa: -45, ft: 90, hd: 0 }), W({ b: -118, ua: 80, fa: 80, th: 100, sa: -43, ft: 90, hd: 28 })] },
    stiff: { p: [W({ ua: 0, fa: 0 }), W({ b: 58, ua: -8, fa: -3, th: 6, sa: 4 })], fr: (J) => dbEnd(J.H) },
    flex: { g: 'hip', p: [W({ b: -90, ua: -90, fa: -90, th: 90, sa: 90, ft: 130 }), W({ b: -90, ua: -90, fa: -90, th: 90, sa: 170, ft: 250 })],
      bk: (J) => ln([J.S[0] - 16, J.hip[1] + 6], [J.K[0] + 12, J.hip[1] + 6], { w: 5 }) + ln([J.hip[0], J.hip[1] + 6], [J.hip[0], FLOOR + 2], { w: 3 }) },
    coice: { p: [W({ b: 28, ua: 50, fa: 80, th: 8, sa: 0, l2: [0, 0] }), W({ b: 28, ua: 50, fa: 80, th: -42, sa: -42, ft: 48, l2: [0, 0] })],
      bk: (J) => ln([J.H[0] + 8, 12], [J.H[0] + 8, FLOOR + 2], { w: 5, op: 0.6 }),
      fr: (J) => cable(J.A, [J.H[0] + 8, FLOOR - 8]) + ci(J.A, 3.5) },
    supino: { g: 'hip', p: [W({ b: -4, ua: -28, fa: 92, th: 90, sa: 0 }), W({ b: -4, ua: 84, fa: 88, th: 90, sa: 0 })],
      bk: (J) => seat(J) + back(J, 14), fr: (J) => ci(J.H, 4) },
    supinc: { g: 'hip', p: [W({ b: -45, ua: -10, fa: 170, th: 80, sa: 2 }), W({ b: -45, ua: 172, fa: 172, th: 80, sa: 2 })],
      bk: (J) => seat(J) + back(J, 12), fr: (J) => dbEnd(J.H) },
    desenv: { g: 'hip', p: [W({ ua: 12, fa: 172, th: 90, sa: 0 }), W({ ua: 172, fa: 172, th: 90, sa: 0 })],
      bk: (J) => seat(J) + back(J, 14), fr: (J) => dbEnd(J.H) },
    tricps: { p: [W({ b: 4, ua: 6, fa: 94 }), W({ b: 4, ua: 6, fa: 6 })],
      fr: (J) => cable(J.H, [J.H[0] + 2, 6]) + ci(J.H, 3.5) },
    frances: { p: [W({ ua: 176, fa: -28 }), W({ ua: 176, fa: 176 })], fr: (J) => dbEnd(J.H) },
    supra: { g: 'hip', p: [W({ b: -90, ua: 88, fa: 88, th: 135, sa: -45 }), W({ b: -62, ua: 75, fa: 80, th: 135, sa: -45 })], bk: (J) => back(J, 8) },
    lateral: { svg: [
      () => front({ hipY: 70, kneeX: 6, kneeY: 88, footX: 7, armA: 8, wt: true }),
      () => front({ hipY: 70, kneeX: 6, kneeY: 88, footX: 7, armA: 88, wt: true })] },
    sumo: { svg: [
      () => front({ hipY: 68, kneeX: 15, kneeY: 86, footX: 22, armEnd: [3, 72], wt1: [80, 76] }),
      () => front({ hipY: 84, kneeX: 27, kneeY: 92, footX: 22, armEnd: [3, 90], wt1: [80, 92] })] },
    abdut: { svg: [
      () => front({ hipY: 78, kneeX: 9, kneeY: 88, footX: 9, armEnd: [17, 80], pre: ln([58, 83], [102, 83], { w: 5 }) + padsAt(9) }),
      () => front({ hipY: 78, kneeX: 28, kneeY: 88, footX: 28, armEnd: [17, 80], pre: ln([58, 83], [102, 83], { w: 5 }) + padsAt(28) })] },
    plat: { lb: ['Posição'], svg: [() =>
      ln([28, FLOOR - 2], [48, FLOOR - 2], { c: 'var(--ink)', w: 4.5 }) +
      pl([[30, FLOOR - 2], [30, 88]]) + pl([[30, 88], [136, FLOOR - 4]]) + pl([[30, 88], [34, 66]]) +
      '<circle cx="19" cy="78" r="7" fill="var(--surface)" stroke="var(--ink)" stroke-width="3.5"/>'] }
  };

  const demo = (e) => {
    const v = EXV[e.id];
    if (!v) return null;
    const lb = v.lb || ['Início', 'Fim'];
    if (v.svg) return { panels: v.svg.map((f) => wrapSvg(f())), labels: lb };
    const Js = place(v.p.map(fk), v);
    return { panels: Js.map((J) => wrapSvg((v.bk ? v.bk(J) : '') + bodySvg(J) + (v.fr ? v.fr(J) : ''))), labels: lb };
  };

  const $ = (s) => document.querySelector(s);
  const screen = $('#screen');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const pad = (n) => (n < 10 ? '0' : '') + n;

  let state = { sets: {}, lastKg: {}, rest: 60 };
  let nav = { view: 'home', day: null, ex: 0 };

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const makeRec = (e) => Array.from({ length: e.kind === 'timed' ? 1 : e.sets }, () => (e.kind === 'sets' ? { kg: '', reps: '', done: false } : { done: false }));
  const rec = (d, e) => {
    const k = d.id + '-' + e.id;
    const want = e.kind === 'timed' ? 1 : e.sets;
    if (!Array.isArray(state.sets[k]) || state.sets[k].length !== want) state.sets[k] = makeRec(e);
    return state.sets[k];
  };
  const exDone = (d, e) => rec(d, e).every((s) => s.done);
  const exCount = (d, e) => rec(d, e).filter((s) => s.done).length;
  const totals = (d) => d.ex.reduce((a, e) => { const r = rec(d, e); a.t += r.length; a.d += r.filter((s) => s.done).length; return a; }, { t: 0, d: 0 });
  const dayDone = (d) => { const t = totals(d); return t.d === t.t; };
  const getDay = (id) => DAYS.find((d) => d.id === id);
  const curDay = () => getDay(nav.day);

  /* Carrega o que foi salvo e traz as marcações da versão anterior */
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === 'object') {
        state.sets = s.sets || {};
        state.lastKg = s.lastKg || {};
        state.rest = [45, 60, 90].indexOf(s.rest) >= 0 ? s.rest : 60;
      }
    } else {
      const old = JSON.parse(localStorage.getItem(OLD) || 'null');
      if (old && old.done) {
        DAYS.forEach((d) => d.ex.forEach((e) => {
          const k = d.id + '-' + e.id;
          const n = +old.done[k] || 0;
          if (n > 0) {
            const r = rec(d, e);
            for (let i = 0; i < Math.min(n, r.length); i++) {
              r[i].done = true;
              if (e.kind === 'sets') {
                r[i].reps = String(e.reps);
                if (old.load && old.load[k]) r[i].kg = old.load[k];
              }
            }
            if (e.kind === 'sets' && old.load && old.load[k]) state.lastKg[e.id] = old.load[k];
          }
        }));
        if ([45, 60, 90].indexOf(old.rest) >= 0) state.rest = old.rest;
      }
      save();
    }
  } catch (err) {}

  /* Telas */
  function weekbar() {
    return '<div class="weekbar">' + DAYS.map((d) => '<i class="' + (dayDone(d) ? 'on' : '') + '"></i>').join('') + '</div>';
  }

  function renderHome() {
    const nDone = DAYS.filter(dayDone).length;
    const next = DAYS.find((d) => !dayDone(d));
    const cards = DAYS.map((d) => {
      const t = totals(d), pct = t.t ? (t.d / t.t) * 100 : 0;
      const done = t.d === t.t;
      return '<button type="button" class="card" style="--dc: var(--d' + d.n + ')" data-act="day" data-day="' + d.id + '">' +
        '<span class="badge">' + (done ? CHECK : d.n) + '</span>' +
        '<span><span class="eyebrow">Dia ' + d.n + (next && next.id === d.id ? '<span class="pill">PRÓXIMO</span>' : '') + '</span>' +
        '<strong>' + esc(d.title) + '</strong>' +
        '<span class="meta">' + d.ex.length + ' etapas · cerca de ' + d.time + '</span>' +
        '<span class="track"><i style="width:' + pct + '%"></i></span></span>' +
        '<span class="chev">' + CHEV + '</span></button>';
    }).join('');
    const tips = TIPS.map((t) => '<div class="tip-item"><b>' + t[0] + '</b><p>' + t[1] + '</p></div>').join('');
    screen.innerHTML =
      '<div class="nav"></div>' +
      '<h1>Seu treino</h1>' +
      '<p class="sub">' + nDone + ' de ' + DAYS.length + ' treinos feitos neste ciclo. Cada dia trabalha grupos musculares diferentes.</p>' +
      weekbar() +
      '<div class="cards">' + cards + '</div>' +
      '<details><summary>Dicas do plano</summary>' + tips +
      '<div class="restpick"><span>Descanso entre séries</span><div class="seg" role="group" aria-label="Tempo de descanso">' +
      [45, 60, 90].map((s) => '<button type="button" data-act="restpick" data-v="' + s + '" aria-pressed="' + (state.rest === s) + '">' + s + ' s</button>').join('') + '</div></div>' +
      '<div class="reset-wrap"><p class="note">Marcações e cargas ficam salvas neste aparelho. Ao terminar os 4 treinos, zere as marcações para começar um novo ciclo. As cargas continuam salvas.</p>' +
      '<button type="button" class="btn small" id="reset" data-act="reset">Zerar marcações do ciclo</button></div></details>';
  }

  function renderDay() {
    const d = curDay(), t = totals(d), pct = t.t ? (t.d / t.t) * 100 : 0;
    const firstOpen = d.ex.findIndex((e) => !exDone(d, e));
    const started = t.d > 0;
    const rows = d.ex.map((e, i) => {
      const r = rec(d, e), c = r.filter((s) => s.done).length, done = c === r.length, dm = demo(e);
      let sub;
      if (e.kind === 'sets') sub = e.sets + ' × ' + e.reps + (e.secs ? ' s' : '') + (e.per ? ' ' + e.per : '');
      else sub = e.detail;
      const st = done ? 'Feito' : (c > 0 ? c + '/' + r.length : (e.kind === 'timed' ? '' : '0/' + r.length));
      return '<button type="button" class="row' + (done ? ' done' : (c > 0 ? ' part' : '')) + '" data-act="ex" data-i="' + i + '">' +
        '<span class="n"><span>' + (i + 1) + '</span>' + CHECK + '</span>' +
        '<span><b>' + esc(e.name) + '</b><small>' + esc(sub) + (st ? ' · ' + st : '') + '</small></span>' +
        (dm ? '<span class="thumb">' + dm.panels[dm.panels.length - 1] + '</span>' : '<span></span>') + '</button>';
    }).join('');
    const cta = firstOpen === -1
      ? '<div class="banner">Dia ' + d.n + ' concluído. Bom trabalho!</div>'
      : '<button type="button" class="btn primary block cta" data-act="resume" data-i="' + firstOpen + '">' + (started ? 'Continuar treino' : 'Começar treino') + '</button>';
    screen.innerHTML =
      '<div class="nav"><button type="button" class="back" data-act="back">' + BACK + 'Início</button></div>' +
      '<div style="--dc: var(--d' + d.n + ')">' +
      '<div class="dayhead"><span class="badge">' + d.n + '</span><div><span class="eyebrow">Dia ' + d.n + ' de ' + DAYS.length + '</span><h2>' + esc(d.title) + '</h2></div></div>' +
      '<div class="tags">' + d.tags.map((g) => '<span class="tag">' + esc(g) + '</span>').join('') + '</div>' +
      '<div class="prog"><div class="track"><i style="width:' + pct + '%"></i></div><span>' + t.d + ' de ' + t.t + '</span></div>' +
      cta +
      '<div class="rows">' + rows + '</div></div>';
  }

  function renderEx() {
    const d = curDay(), i = nav.ex, e = d.ex[i], r = rec(d, e);
    const done = r.every((s) => s.done), last = i === d.ex.length - 1;
    let target, body = '';
    if (e.kind === 'sets') {
      target = '<div class="target"><b>' + e.sets + ' × ' + e.reps + (e.secs ? ' s' : '') + '</b><span>séries × ' + (e.secs ? 'segundos' : 'repetições') + (e.per ? ' ' + e.per : '') + '</span></div>';
      const ph = state.lastKg[e.id] || '0';
      const bw = !!e.bw;
      body = '<div class="sets"><div class="sethead' + (bw ? ' bw' : '') + '"><span>Série</span>' + (bw ? '' : '<span>Carga (kg)</span>') + '<span>' + (e.secs ? 'Segundos' : 'Reps') + '</span><span></span></div>' +
        r.map((s, k) =>
          '<div class="set' + (bw ? ' bw' : '') + (s.done ? ' done' : '') + '"><span class="no">' + (k + 1) + '</span>' +
          (bw ? '' : '<input type="text" inputmode="decimal" maxlength="6" id="kg-' + k + '" data-field="kg" data-s="' + k + '" placeholder="' + esc(ph) + '" value="' + esc(s.kg) + '" aria-label="Carga em quilos, série ' + (k + 1) + '">') +
          '<input type="text" inputmode="numeric" maxlength="3" id="reps-' + k + '" data-field="reps" data-s="' + k + '" placeholder="' + e.reps + '" value="' + esc(s.reps) + '" aria-label="' + (e.secs ? 'Segundos' : 'Repetições') + ', série ' + (k + 1) + '">' +
          '<button type="button" class="tick" data-act="toggle" data-s="' + k + '" aria-pressed="' + s.done + '" aria-label="' + (s.done ? 'Desmarcar' : 'Concluir') + ' série ' + (k + 1) + '">' + CHECK + '</button></div>'
        ).join('') + '</div>';
    } else if (e.kind === 'timed') {
      target = '<div class="target"><span>' + esc(e.detail) + '</span></div>';
      body = '<button type="button" class="big' + (r[0].done ? ' on' : '') + '" data-act="toggle" data-s="0">' + CHECK + '<span>' + (r[0].done ? 'Feito' : 'Marcar como feito') + '</span></button>';
    } else {
      target = '<div class="target"><b>' + e.sets + ' rodadas</b><span>' + esc(e.detail.replace(/^\d+ rodadas de /, '')) + '</span></div>';
      body = '<div class="rounds">' + r.map((s, k) => '<button type="button" class="rd" data-act="toggle" data-s="' + k + '" aria-pressed="' + s.done + '" aria-label="Rodada ' + (k + 1) + '">' + (k + 1) + '</button>').join('') + '</div>';
    }
    const dm = demo(e);
    const demoHtml = dm
      ? '<div class="demo n' + dm.panels.length + '">' + dm.panels.map((s, k) => '<figure class="panel">' + s + '<figcaption>' + esc(dm.labels[k] || '') + '</figcaption></figure>').join('') + '</div>' +
        '<p class="demo-note">Desenho esquemático da posição do corpo. O vídeo mostra o movimento completo.</p>'
      : '';
    const dots = d.ex.map((x, k) => '<i class="' + (exDone(d, x) ? 'on' : '') + (k === i ? ' cur' : '') + '"></i>').join('');
    screen.innerHTML =
      '<div class="nav"><button type="button" class="back" data-act="back">' + BACK + 'Dia ' + d.n + '</button></div>' +
      '<div style="--dc: var(--d' + d.n + ')">' +
      '<span class="eyebrow">' + esc(d.title) + ' · ' + (i + 1) + ' de ' + d.ex.length + '</span>' +
      '<div class="dots">' + dots + '</div>' +
      '<h2 class="exname">' + esc(e.name) + '</h2>' + target + demoHtml +
      '<div class="tip"><span class="eyebrow">Como fazer</span><p>' + esc(e.tip) + '</p></div>' +
      '<a class="btn small block vid" href="https://www.youtube.com/results?search_query=' + encodeURIComponent((e.q || e.name) + ' como fazer') + '" target="_blank" rel="noopener">Ver vídeo de como fazer</a>' +
      body +
      '<div class="exnav"><button type="button" class="btn" data-act="prev"' + (i === 0 ? ' disabled' : '') + '>Anterior</button>' +
      '<button type="button" class="btn' + (done ? ' primary' : '') + '" data-act="next">' + (last ? (done ? 'Concluir treino' : 'Voltar ao dia') : (done ? 'Próximo exercício' : 'Pular')) + '</button></div></div>';
  }

  function render() {
    if (nav.view === 'home') renderHome();
    else if (nav.view === 'day') renderDay();
    else renderEx();
  }
  function go(view, extra) {
    nav = Object.assign({ view, day: nav.day, ex: nav.ex }, extra || {});
    render();
    window.scrollTo(0, 0);
  }

  /* Cronômetro de descanso */
  let restEnd = 0, restTotal = 60, restTimer = null, hideT = null, ac = null;
  const restEl = $('#rest');
  const fmt = (s) => Math.floor(s / 60) + ':' + pad(s % 60);
  function unlockAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function beep() {
    try {
      if (ac) [0, 0.3].forEach((t) => {
        const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
        o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.25, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.22);
        o.start(s); o.stop(s + 0.25);
      });
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  function hideRest() { clearInterval(restTimer); clearTimeout(hideT); restTimer = null; restEnd = 0; restEl.hidden = true; }
  function tick() {
    const left = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
    $('#restTime').textContent = fmt(left);
    $('#restFill').style.width = (restTotal ? Math.min(100, (left / restTotal) * 100) : 0) + '%';
    if (left <= 0) {
      clearInterval(restTimer); restTimer = null; restEnd = 0;
      $('#restLabel').textContent = 'Descanso acabou · próxima série';
      beep();
      hideT = setTimeout(hideRest, 6000);
    }
  }
  function startRest(sec) {
    unlockAudio();
    clearInterval(restTimer); clearTimeout(hideT);
    restTotal = sec; restEnd = Date.now() + sec * 1000;
    $('#restLabel').textContent = 'Descanso';
    restEl.hidden = false;
    tick();
    restTimer = setInterval(tick, 250);
  }
  restEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-r]');
    if (!b) return;
    const r = b.dataset.r;
    if (r === 'skip') { hideRest(); return; }
    if (!restEnd) return;
    restEnd = Math.max(Date.now() + 1000, restEnd + +r * 1000);
    restTotal = Math.max(restTotal, Math.ceil((restEnd - Date.now()) / 1000));
    tick();
  });

  /* Tela ligada durante o treino */
  let wl = null, started = false;
  function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wl) {
        navigator.wakeLock.request('screen').then((l) => { wl = l; l.addEventListener('release', () => { wl = null; }); }).catch(() => { wl = null; });
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && started) keepAwake(); });

  /* Eventos */
  let armed = false, armT = null;
  screen.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'day') { nav.day = el.dataset.day; go('day'); }
    else if (act === 'back') {
      if (nav.view === 'ex') go('day'); else go('home');
    }
    else if (act === 'ex' || act === 'resume') { go('ex', { ex: +el.dataset.i }); }
    else if (act === 'prev') { if (nav.ex > 0) go('ex', { ex: nav.ex - 1 }); }
    else if (act === 'next') {
      const d = curDay();
      if (nav.ex < d.ex.length - 1) go('ex', { ex: nav.ex + 1 }); else go('day');
    }
    else if (act === 'toggle') {
      const d = curDay(), e = d.ex[nav.ex], r = rec(d, e), i = +el.dataset.s, s = r[i];
      s.done = !s.done;
      if (s.done && e.kind === 'sets') {
        if (s.reps === '') s.reps = String(e.reps);
        if (!e.bw) {
          if (s.kg === '') s.kg = (i > 0 && r[i - 1].kg) || state.lastKg[e.id] || '';
          if (s.kg) state.lastKg[e.id] = s.kg;
        }
      }
      save();
      started = true; keepAwake();
      render();
      if (dayDone(d)) hideRest();
      else if (s.done && e.kind === 'sets') startRest(state.rest);
    }
    else if (act === 'restpick') {
      state.rest = +el.dataset.v; save();
      screen.querySelectorAll('[data-act="restpick"]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.v === state.rest ? 'true' : 'false'));
    }
    else if (act === 'reset') {
      if (!armed) {
        armed = true;
        el.textContent = 'Toque de novo para zerar o ciclo';
        el.classList.add('primary');
        armT = setTimeout(() => { armed = false; el.textContent = 'Zerar marcações do ciclo'; el.classList.remove('primary'); }, 4000);
      } else {
        clearTimeout(armT); armed = false;
        state.sets = {}; save(); hideRest();
        render();
      }
    }
  });

  screen.addEventListener('input', (ev) => {
    const inp = ev.target.closest('input[data-field]');
    if (!inp) return;
    const d = curDay(), e = d.ex[nav.ex], r = rec(d, e), s = r[+inp.dataset.s];
    let v = inp.value;
    if (inp.dataset.field === 'kg') { v = v.replace(',', '.').replace(/[^0-9.]/g, ''); if (v !== inp.value) inp.value = v; s.kg = v; if (v && s.done) state.lastKg[e.id] = v; }
    else { v = v.replace(/[^0-9]/g, ''); if (v !== inp.value) inp.value = v; s.reps = v; }
    save();
  });

  /* Abre direto no próximo treino pendente */
  const nextDay = DAYS.find((d) => !dayDone(d));
  if (nextDay && totals(nextDay).d > 0) {
    nav = { view: 'day', day: nextDay.id, ex: 0 };
  }
  render();
})();
</script>
</body>
</html>
